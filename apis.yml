name: Rtv
description: Rtv (Return to Vendor) is a materials-innovation company building a circular
  recycling system for nylon-6. Its patented molecular design regenerates nylon that can be
  recycled infinitely without quality loss, yielding production-ready recyclable yarn, monomaterial
  stretch fabric, and regenerated pellets for injection molding and extrusion. The company also
  offers end-of-life textile collection, waste reprocessing, and regulatory-compliance support
  (EPR, California SB 707, EU textile regulations) for apparel, automotive, and technical
  industrial applications. Backed by Khosla Ventures, Third Sphere, Teknor Apex, and NSF SBIR grants.
